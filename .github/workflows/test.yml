name: Test
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: list files before
        run: ls -a
      - name: checkout
        uses: actions/checkout@v3
      - name: list files after
        run: ls -a

  ubuntu_build:
    runs-on: ubuntu-latest
    steps:
      - name: run cmd
        run: echo "Hello new World!"
      - name: run multiple cmd
        run: |
          npm -v
          node -v
  windows_build:
    runs-on: windows-latest
    needs: ubuntu_build
    steps:
      - name: windows cmds
        run: Write-Output "Windows String"
      - name: error cmd_test
        run: doesnotexist   